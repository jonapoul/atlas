x-atlas: &atlas
  # CI overrides the tag when a PR rebuilds the image; defaults to the published one.
  image: ghcr.io/jonapoul/atlas-gradle-plugin:${ATLAS_IMAGE_TAG:-latest}
  # Lets scripts build the image locally, so they run against the tool versions
  # pinned in the Dockerfile rather than whatever is installed on the host.
  build:
    context: ..
    dockerfile: docker/Dockerfile
  volumes:
    - $HOME/.gradle:/home/gradle/.gradle
    - ..:/atlas
  working_dir: /atlas

services:
  check:
    <<: *atlas
    command: >
      gradle -Dorg.gradle.java.home=/opt/java/openjdk/ check

  test:
    <<: *atlas
    command: >
      gradle -Dorg.gradle.java.home=/opt/java/openjdk/ test

  samples:
    <<: *atlas
    command: ./scripts/runAtlasGenerate.sh
