name: ktfmt

on:
  push:
    paths:
      - "**.kt"
      - "**.kts"
      - ".editorconfig"
      - "scripts/ktfmt.sh"
      - "scripts/lib/git.sh"

permissions:
  contents: read
  pull-requests: read

jobs:
  ktfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version-file: .github/workflows/.java-version
          distribution: zulu

      - name: Run
        run: scripts/ktfmt.sh check --force
